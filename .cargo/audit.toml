# cargo-audit config · advisory ignores (vector 15 cargo-audit-rustsec reads this).
# Document every entry: RUSTSEC ID + reason + upstream + review date.
# Keep in sync with deny.toml [advisories].ignore (vector 34).

[advisories]
ignore = [
  # RUSTSEC-2026-0194 + RUSTSEC-2026-0195 · quick-xml DoS pair (quadratic
  # dup-attr check + unbounded NsReader namespace allocation · fix >=0.41.0).
  # 2026-07-10: the DEFAULT-BUILD graph is CLEAN — feed-rs 2.4.0 shipped the
  # quick-xml 0.41 bump (taken same-week) and nika-extract's direct sitemap
  # parser rides 0.41.0. What remains is feature-gated OFF and never in a
  # default or release build:
  #   · quick-xml 0.30.0 ← xcb 1.7 ← xcap 0.9.6 ← nika-screen — the xcap
  #     feature is OFF by default (ADR-081 arc · headless builds) and
  #     Linux-X11-only.
  #   · quick-xml 0.39.4 · same feature-gated screen-capture cluster.
  # The entries stay ONLY for `--features xcap` dev builds on Linux/X11.
  # Review: 2026-08-10 · drop when xcb/xcap cross 0.41 upstream.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # RUSTSEC-2026-0367 + RUSTSEC-2026-0368 + RUSTSEC-2026-0369 +
  # RUSTSEC-2026-0429 · zip 7.2.0 extraction (SUID/SGID bits, symlink targets,
  # permissions through symlinks, a process abort on a symlink entry with a
  # large declared size · fix >=9.0.0), all in `ZipArchive::extract` /
  # `ZipStreamReader::extract`. Only candle-core 0.10.2 → nika-infer-local
  # pulls zip 7.2, and it reads `.npz` / `.pth` entries and writes `.npz`: it
  # never extracts an archive (re-read on 2026-11-10 for RUSTSEC-2026-0429).
  # candle-core 0.11.1 (2026-10-31) requires zip ^9.1.3, which carries every
  # fix: moving nika-infer-local to candle 0.11 drops zip 7.2 and these
  # entries. Review: with that upgrade (NIK-307). The unmaintained zbus trio
  # (RUSTSEC-2026-0370..0372) and chrono (RUSTSEC-2026-0543) stay cargo-audit
  # warnings, as `paste` does; deny.toml documents them.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  "RUSTSEC-2026-0429",
  # RUSTSEC-2026-0545 + RUSTSEC-2026-0546 + RUSTSEC-2026-0547 +
  # RUSTSEC-2026-0548 · four more zip 7.2.0 advisories: AES entries returned
  # without their authentication check (`aes-crypto`), `ZipArchive::extract`
  # through chained symlinks, the legacy decoders' preallocation
  # (`legacy-zip`), and `ZipStreamReader` names that differ from the central
