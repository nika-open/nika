  # 2026-11-20. Review: with the candle 0.11 upgrade (NIK-307). Mirror:
  # deny.toml.
  "RUSTSEC-2026-0545",
  "RUSTSEC-2026-0546",
  "RUSTSEC-2026-0547",
  "RUSTSEC-2026-0548",
