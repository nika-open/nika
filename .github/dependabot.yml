# Dependabot · weekly freshness for the two ecosystems that feed the build,
# and for the media scripts' npm lockfiles, which ship in no binary.
# Security-update toggles are repo settings (operator switch); this file
# drives version updates + the Scorecard Dependency-Update-Tool check.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    # One grouped PR per wave · never per-action: the codeql-action
    # init/analyze pair MUST move together (a split bump leaves the pair
    # at different versions inside one workflow run and CodeQL fails ·
    # proven on nika-spec 2026-07-19, first ungrouped wave).
    groups:
      github-actions:
        patterns:
          - "*"
  # The media pipeline (scripts/media, and each motion scene under
  # scripts/media/motion) is a set of private npm projects: they render the
  # motion scenes and reach no release artifact. Their lockfiles still raise
  # alerts, and no version update watched them. In scripts/media, `next` is
  # only a peer of `geist`, pinned by `overrides` in its package.json: if an
  # update cannot move that override, bump it by hand and regenerate the
  # lockfile (`npm install --package-lock-only --ignore-scripts`).
  - package-ecosystem: npm
    directories:
      - "/scripts/media"
      - "/scripts/media/motion/*"
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 3
    groups:
      media-npm:
        patterns:
          - "*"
