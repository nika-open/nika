# Dependabot · weekly freshness for the two ecosystems that feed the build,
# and for the media scripts' npm lockfile, which ships in no binary.
# Security-update toggles are repo settings (operator switch); this file
# drives version updates + the Scorecard Dependency-Update-Tool check.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    # One grouped PR per wave · never per-action: the codeql-action
    # init/analyze pair MUST move together (a split bump leaves the pair
    # at different versions inside one workflow run and CodeQL fails ·
    # proven on nika-spec 2026-07-19, first ungrouped wave).
    groups:
      github-actions:
        patterns:
          - "*"
  # The media pipeline (scripts/media) is a private npm project: it renders
  # the motion scenes and reaches no release artifact. Its lockfile still
  # raises alerts, and no version update watched it. `next` is only a peer
  # of `geist`, pinned by `overrides` in its package.json: if an update
  # cannot move that override, bump it by hand and regenerate the lockfile
  # (`npm install --package-lock-only --ignore-scripts`).
  - package-ecosystem: npm
    directory: "/scripts/media"
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 2
    groups:
      media-npm:
        patterns:
          - "*"
