# nika-catalog — MCP server catalog
#
# Aligns with the official MCP Registry schema (registry.modelcontextprotocol.io,
# v2025-12-11): each server exposes one or more local-install `packages`
# (npm/pypi/oci/cargo/mcpb) and/or one or more `remotes` (HTTP/SSE endpoints).
#
# Schema invariants (enforced in build.rs):
#   * top-level `schema` matches MCP_SERVERS_SCHEMA constant
#   * unique server id (case-insensitive, ASCII-only)
#   * packages.len() + remotes.len() >= 1
#   * category parses to a known Category variant
#   * pricing ∈ {free, freemium, paid}
#   * runner is pypi-only (non-pypi + runner = error; pypi + no runner = error)
#   * aliases never collide with any id or another alias
#   * effect_hints (@1.1 · optional · per tool) — the MCP readOnlyHint /
#     destructiveHint manifest annotations. Each entry must carry ≥1 hint
#     and never both read_only=true and destructive=true. NO entries are
#     vendored yet (schema slot only): an ABSENT table means no manifest
#     vendored — never "the tools are safe".

schema = "nika/mcp-servers@1.1"

# ─── [meta] · what this file claims, and on what evidence ───────────────────
#
# This is a CENSUS shelf: it describes THIRD-PARTY products. Its contract is
# "this exists, according to THIS source, on THIS date".
#
# `last_verified` is a per-entry measurement, written by
# `bash scripts/refresh-mcp-servers.sh`: the date on which every package of the
# entry resolved on its registry (npm, PyPI, OCI) and every remote answered an
# MCP `initialize`. An entry the last refresh could not verify (dead, deprecated
# upstream, or unreachable) keeps its older date, so an old date is a visible
# signal, never a silent one. Until 2026-11-24 every entry carried one batch
# stamp, "2026-04-14"; an entry that still carries it has never been verified
# one by one. Probe:
#   grep -oE 'last_verified = "[0-9-]+"' mcp-servers.toml | sort | uniq -c
#
# `pricing` stays EDITORIAL: a commercial claim about a third party with no
# per-entry `source` field. Entries added from 2026-11-24 on name their vendor
# source in a comment above the entry; read `pricing` as a hint, never a quote.
#
# No gate watches this file yet. `PRICING_STALE_DAYS = 120`
# (crates/nika-cli-host/src/doctor.rs) guards the PRICE snapshot only; a gate
# for this shelf should fail on age AND on uniform dates.
#
# The region below is GENERATED by the refresh script: do not hand-edit it.
# BEGIN generated [meta] by scripts/refresh-mcp-servers.sh
[meta]
shelf = "census"
last_verified_semantics = "per-entry"
as_of = "2026-11-24"
source = "registry.npmjs.org · pypi.org · ghcr.io / registry-1.docker.io · remote MCP initialize · registry.modelcontextprotocol.io (cross-check)"
refresh = "bash scripts/refresh-mcp-servers.sh"
entries = 120
verified = 113
dead = 0
deprecated_upstream = 7
unknown = 0
listed_in_mcp_registry = 44
distinct_last_verified_values = 2
source_field_present = false
staleness_budget_days = 120
gate = "ABSENT"
upstream = "registry.modelcontextprotocol.io"
# END generated [meta]
# ─────────────────────────────────────────────────────────────────────────────


