  # A late confirm gate that defaults to no stands before their send. With
  # the fixtures, inbox-triage and receipt-ledger close it on their data
  # (nothing to draft, nothing to book), so neither answer reaches the send:
  # `nika check` is its only proof. ci-failure-triage crosses it on a yes,
  # and its POST to a documentation host recovers to a `posted: false`
  # receipt.
  - { slug: inbox-triage, expect: { rc: 0 } }
  - { slug: receipt-ledger, expect: { rc: 0 } }
  - { slug: ci-failure-triage, answers: { approve: "true" }, expect: { rc: 0 } }
  # A confirm gate with no default stands first in these seven, and every
  # later task waits on it: fetches, a POST, a render queue, a local scan.
  # Their rows say yes, so the whole job runs. The engine refuses the
  # reserved documentation hosts the fetches and the POST name before it
  # dials, and each is recovered. The render queue meets a closed port: the
  # harness first connects to 127.0.0.1:8188 and refuses to run the row if a
  # program answers there, so a local ComfyUI is never reached.
  # Unanswered, each one pauses with nothing written
  # (`the_root_gated_recipes_pause_unanswered_and_write_nothing`).
  - { slug: comfyui-image-chain, answers: { approve: "true" }, expect: { rc: 0 } }
  - { slug: feed-digest, answers: { approve: "true" }, expect: { rc: 0 } }
  - { slug: lead-enrichment, answers: { approve: "true" }, expect: { rc: 0 } }
  - { slug: listing-link-audit, answers: { approve: "true" }, expect: { rc: 0 } }
  - { slug: qr-art-forge, answers: { approve: "true" }, expect: { rc: 0 } }
  - { slug: refund-chaser, answers: { approve: "true" }, expect: { rc: 0 } }
  - { slug: seo-site-audit, answers: { approve: "true" }, expect: { rc: 0 } }
  # launch-campaign-forge runs on a Codex seat over ACP and reaches
